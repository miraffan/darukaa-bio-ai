<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Biodiversity Scientist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EAE0; --surface:#F5F8F2; --ink:#1E2B22; --muted:#56645A; --line:#C5D0C1;
  --moss:#3F6B47; --on-moss:#FFFFFF; --water:#2E6B86; --ochre:#8A5F12; --chip:#DDE7D8; --seg:#C5D0C1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131E18; --surface:#1B2A22; --ink:#E3EBE1; --muted:#9DB0A2; --line:#2F4237;
    --moss:#8DBF95; --on-moss:#10201A; --water:#7DB7D1; --ochre:#D9A94E; --chip:#25382D; --seg:#33493C;
  }
}
:root[data-theme="dark"]{
  --bg:#131E18; --surface:#1B2A22; --ink:#E3EBE1; --muted:#9DB0A2; --line:#2F4237;
  --moss:#8DBF95; --on-moss:#10201A; --water:#7DB7D1; --ochre:#D9A94E; --chip:#25382D; --seg:#33493C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3{font-family:'Literata',Georgia,'Times New Roman',serif;font-weight:600;line-height:1.25;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;min-height:100dvh;display:flex;flex-direction:column}
.strata{display:flex;height:10px;margin:0 -16px}
.strata i{flex:1}
.strata i:nth-child(1){background:#4A3B22}.strata i:nth-child(2){background:#6E5634}
.strata i:nth-child(3){background:#9C7B4E}.strata i:nth-child(4){background:#C9B187}
header{padding:18px 0 10px}
header h1{font-size:1.6rem}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem;max-width:56ch}
.memory{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0 12px;min-height:44px}
.memory .label{color:var(--muted);font-size:.85rem;margin-right:2px}
.tag{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.85rem;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--water);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
#chat{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}
.msg{max-width:100%;border-radius:14px;padding:12px 14px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--moss);color:var(--on-moss);max-width:88%}
.msg.bot{background:var(--surface);border:1px solid var(--line)}
.msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}
.msg ul{margin:6px 0 0;padding-left:20px}
.msg li{margin:3px 0}
.sec{margin:14px 0 6px;font-size:1.05rem}
.sec:first-child{margin-top:0}
.link{border-left:3px solid var(--water);padding:2px 0 2px 10px;margin:8px 0;font-size:.95rem}
.link em{color:var(--muted)}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--bg)}
.rec h3{font-size:1.05rem;margin-bottom:8px}
.hz{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.85rem;color:var(--muted)}
.hz .bar{display:flex;gap:3px}
.hz .bar span{width:22px;height:8px;border-radius:2px;background:var(--seg)}
.hz .bar span.on{background:var(--moss)}
.row{margin:8px 0}
.row b{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.src{font-style:italic;color:var(--muted);font-size:.9rem}
.conf{color:var(--ochre);font-weight:600}
details{margin-top:10px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--water);font-size:.95rem}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.hint{color:var(--muted);font-size:.9rem}
.examples{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ex{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;font-size:.95rem;cursor:pointer;min-height:44px}
.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.composer form{display:flex;gap:8px}
.composer input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:48px}
.composer button.send{font:inherit;font-weight:600;padding:0 18px;border-radius:12px;border:0;background:var(--moss);color:var(--on-moss);min-height:48px;cursor:pointer}
.jsonbox{margin-top:6px}
.jsonbox textarea{width:100%;height:150px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.jsonbox button{margin-top:6px;font:inherit;padding:0 14px;border-radius:10px;border:1px solid var(--moss);background:transparent;color:var(--ink);min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--water);outline-offset:2px}
</style>
</head>
<body>
<div class="strata" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <h1>AI Biodiversity Scientist</h1>
    <p>Tell me about your land. I diagnose soil, water, climate and habitat together, then recommend cited actions.</p>
  </header>
  <div class="memory" id="memory" aria-live="polite"></div>
  <main id="chat">
    <div class="msg bot" id="intro">
      <p>Describe your land in plain words or paste JSON. I ask follow-ups when something important is missing.</p>
      <div class="examples">
        <button class="ex" data-q="Biodiversity is declining on my land">Biodiversity is declining on my land</button>
        <button class="ex" data-q="Soil organic carbon 0.3%, low rainfall, monoculture wheat, semi-arid">Soil organic carbon 0.3%, low rainfall, monoculture wheat, semi-arid</button>
        <button class="ex" data-q="pH 4.8, SOC 0.8%, 900 mm rainfall, cropland with heavy pesticide use and fragmented habitat">pH 4.8, SOC 0.8%, 900 mm rainfall, cropland with heavy pesticide use and fragmented habitat</button>
      </div>
    </div>
  </main>
  <div class="composer">
    <form id="form" autocomplete="off">
      <input id="text" type="text" placeholder="Describe soil, rainfall, land use..." aria-label="Message">
      <button class="send" type="submit">Send</button>
    </form>
    <details class="jsonbox">
      <summary>Structured input (JSON)</summary>
      <textarea id="json" aria-label="JSON input">{
  "soc": 0.3,
  "rainfall": "low",
  "land_use": "monoculture",
  "crop": "wheat",
  "region": "semi-arid",
  "temp_c": 32,
  "lat": 26.9,
  "lon": 75.8
}</textarea>
      <button id="runjson" type="button">Analyse JSON</button>
    </details>
  </div>
</div>

<script>
const KB = [{"id": "legume_cover_crops", "title": "Legume cover crops / legume rotation", "triggers": ["low_soc", "monoculture", "declining"], "action": "Add a legume cover crop or rotation phase (cowpea, vetch, clover, lentil) between main crops.", "why": "Legume roots and residues feed soil microbes and fix nitrogen, cutting fertiliser need, while extra biomass builds soil organic carbon. In water-limited sites use short-season legumes and terminate them early so they do not drain soil moisture.", "metrics": ["Soil organic carbon", "Microbial diversity", "Soil nitrogen", "Pollinator forage"], "effect": "Cover crops add ~0.3 Mg C/ha/yr on average (global meta-analysis); slow but compounding.", "horizon": "Medium (2-5 years)", "confidence": "Medium", "source": "Poeplau & Don (2015), Agric. Ecosyst. Environ. 200:33-41; FAO (2017) Soil Organic Carbon: the hidden potential"}, {"id": "agroforestry", "title": "Agroforestry (trees integrated with crops)", "triggers": ["monoculture", "low_soc", "water_limited", "heat", "fragmentation", "deforestation", "declining"], "action": "Integrate multipurpose native/nitrogen-fixing trees in alleys or field boundaries (e.g., 5-10% of land), using species suited to local rainfall.", "why": "Trees add litter and deep roots (raising soil carbon and infiltration), provide shade that lowers soil temperature and evaporation, and create habitat and stepping-stones that reconnect fragmented landscapes.", "metrics": ["Soil organic carbon", "Species richness", "Habitat connectivity", "Soil moisture", "Microclimate"], "effect": "European meta-analysis found higher biodiversity and better soil fertility / erosion control than treeless farming; IPCC lists agroforestry as an adaptation + mitigation option with soil-carbon co-benefits.", "horizon": "Long (3-10 years)", "confidence": "Medium-High", "source": "Torralba et al. (2016), Agric. Ecosyst. Environ. 230:150-161; IPCC SRCCL (2019) Ch. 6"}, {"id": "diversified_cropping", "title": "Intercropping and multi-crop rotations", "triggers": ["monoculture", "declining", "pollution", "low_soc"], "action": "Replace single-crop cycles with intercropping (cereal + legume) or a 3+ crop rotation including a deep-rooted crop.", "why": "Diverse root systems and residues support broader microbial and invertebrate communities, break pest cycles (reducing pesticide need), and spread water and nutrient use across soil layers.", "metrics": ["Species richness", "Soil quality", "Pest pressure", "Pesticide load"], "effect": "Crop diversification raised on-farm biodiversity by ~24% on average in a global meta-analysis; yield effects are variable, so pilot on part of the land first.", "horizon": "Short-Medium (1-3 years)", "confidence": "High", "source": "Beillouin et al. (2021), Global Change Biology 27:4697-4710; Tamburini et al. (2020), Science Advances 6:eaba1715"}, {"id": "notill_mulch", "title": "Reduced tillage with residue mulching", "triggers": ["water_limited", "heat", "low_soc"], "action": "Move to no-till / minimum tillage and keep crop residue as surface mulch.", "why": "Mulch cuts evaporation and buffers soil temperature, protecting soil fauna; undisturbed aggregates hold water better. Note: carbon gains are mostly near the surface and smaller than often claimed, so the main win is moisture and soil-life protection.", "metrics": ["Soil moisture", "Soil temperature", "Soil fauna / microbial activity", "Soil organic carbon (modest)"], "effect": "No-till with residue retention and rotation performs comparably or better than conventional tillage in dry climates.", "horizon": "Short-Medium (1-3 years)", "confidence": "Medium", "source": "Pittelkow et al. (2015), Nature 517:365-368; Powlson et al. (2014), Nature Climate Change 4:678-683"}, {"id": "water_harvesting", "title": "Rainwater harvesting (contour bunds, swales, farm ponds)", "triggers": ["water_limited", "deforestation"], "action": "Build contour bunds / swales and small farm ponds to slow runoff and recharge soil and groundwater.", "why": "In low-rainfall areas most water is lost as runoff. Capturing it extends soil moisture into dry spells, sustains vegetation and wetlands species, and supports tree establishment.", "metrics": ["Soil moisture", "Infiltration", "Water availability for species", "Vegetation cover"], "effect": "Improves infiltration and growing-season moisture; magnitude is site-specific, so measure with soil-moisture sensors or NDMI before/after.", "horizon": "Short (<1 year to build; benefits within 1-2 seasons)", "confidence": "Medium", "source": "IPCC AR6 WGII (2022) Ch. 5; FAO water-harvesting guidance"}, {"id": "liming", "title": "Lime application to correct soil acidity", "triggers": ["acidic"], "action": "Apply agricultural lime based on a soil buffer-pH test, targeting pH ~6-7, ideally combined with organic matter.", "why": "Soil pH is the strongest predictor of soil bacterial diversity; acidity also suppresses decomposition and legume nodulation, so lime should come before legume-based interventions.", "metrics": ["Soil pH", "Microbial diversity", "Nutrient availability"], "effect": "Bacterial diversity peaks near neutral pH; correcting acidity restores microbial function within 1-2 seasons.", "horizon": "Short (6-18 months)", "confidence": "High (relationship) / Medium (magnitude)", "source": "Fierer & Jackson (2006), PNAS 103:626-631"}, {"id": "organic_amendments", "title": "Compost / manure / biochar amendments", "triggers": ["low_soc", "alkaline", "water_limited"], "action": "Apply compost or well-rotted manure (and optionally biochar) each season, targeted to the poorest zones.", "why": "Organic amendments directly add carbon and nutrients, stimulate microbial biomass, improve aggregate structure and water retention, and buffer high pH.", "metrics": ["Soil organic carbon", "Microbial activity", "Water-holding capacity", "Soil pH (buffering)"], "effect": "Long-term studies show consistent increases in soil organic carbon and microbial activity with organic amendments.", "horizon": "Short-Medium (1-3 years)", "confidence": "High", "source": "Diacono & Montemurro (2010), Agron. Sustain. Dev. 30:401-422"}, {"id": "hedgerows_flower_strips", "title": "Hedgerows and flower strips on field margins", "triggers": ["monoculture", "fragmentation", "pollution", "declining"], "action": "Plant native flowering hedgerows or 3-6 m wildflower strips along field edges and drainage lines.", "why": "They provide nesting and forage for pollinators and natural enemies of pests, act as corridors between habitat patches, and trap spray drift and runoff.", "metrics": ["Pollinator abundance", "Natural pest control", "Habitat connectivity", "Species richness"], "effect": "Synthesis of field studies shows flower strips and hedgerows improve pollination and pest control services.", "horizon": "Short-Medium (1-3 years)", "confidence": "Medium-High", "source": "Albrecht et al. (2020), Ecology Letters 23:1488-1498; Kremen & Miles (2012), Ecology and Society 17(4):40"}, {"id": "habitat_corridors", "title": "Habitat corridors linking remnant patches", "triggers": ["fragmentation", "deforestation"], "action": "Restore vegetated corridors (or stepping-stone patches) between remaining natural habitat fragments.", "why": "Fragmentation isolates populations and reduces biodiversity; corridors restore movement, gene flow and recolonisation.", "metrics": ["Habitat connectivity", "Species richness", "Population viability"], "effect": "Fragmentation reduces biodiversity by 13-75% across studies; corridors raise movement between patches by ~50% on average.", "horizon": "Medium-Long (3-10 years)", "confidence": "High", "source": "Haddad et al. (2015), Science Advances 1:e1500052; Gilbert-Norton et al. (2010), Conservation Biology 24:660-668"}, {"id": "ipm_pesticide_reduction", "title": "Integrated pest management (IPM) and input reduction", "triggers": ["pollution", "monoculture"], "action": "Adopt IPM: scouting thresholds, biological control, targeted (not calendar) spraying, and buffer strips near habitats.", "why": "Pesticide use has persistent negative effects on farmland biodiversity and natural pest control; lowering exposure lets predators and pollinators recover.", "metrics": ["Species richness", "Natural enemy abundance", "Water and soil contamination"], "effect": "Reduced pesticide intensity is associated with higher farmland biodiversity and biological control potential.", "horizon": "Short (1-2 seasons)", "confidence": "Medium-High", "source": "Geiger et al. (2010), Basic and Applied Ecology 11:97-105"}, {"id": "riparian_buffers", "title": "Vegetated riparian / drainage buffer strips", "triggers": ["pollution", "water_limited"], "action": "Establish perennial native vegetation strips along streams, ditches and ponds.", "why": "Buffers filter sediment and nutrients before they reach water bodies, stabilise banks, and keep aquatic and amphibian habitat viable.", "metrics": ["Water quality", "Aquatic species richness", "Bank stability"], "effect": "Reviews report substantial reductions in sediment and nutrient loads; efficacy depends on buffer width and slope.", "horizon": "Medium (2-5 years)", "confidence": "Medium", "source": "Zhang et al. (2010), J. Environ. Quality 39:76-84"}, {"id": "assisted_regeneration", "title": "Assisted natural regeneration", "triggers": ["deforestation", "declining"], "action": "Protect cleared or degraded plots from grazing and fire, remove invasives, and let native vegetation regrow, supplementing with targeted planting.", "why": "Where seed sources and soil seedbanks remain, natural regeneration recovers biodiversity better and cheaper than full planting.", "metrics": ["Species richness", "Forest cover", "Soil organic carbon", "Habitat connectivity"], "effect": "Natural regeneration outperformed active restoration for biodiversity and structure recovery in tropical forests.", "horizon": "Long (5-20 years)", "confidence": "Medium-High", "source": "Crouzeilles et al. (2017), Science Advances 3:e1701345"}, {"id": "resilient_species", "title": "Drought/heat-tolerant native and locally adapted species mixes", "triggers": ["heat", "water_limited", "declining"], "action": "Shift to drought-tolerant crops (millets, sorghum + legume mixes) and native shade/forage trees suited to projected climate.", "why": "Rising temperature and erratic rainfall push non-adapted species past physiological limits; adapted mixes maintain ground cover, soil carbon and habitat through dry spells.", "metrics": ["Vegetation cover", "Species survival", "Soil moisture", "Yield stability"], "effect": "Climate-adapted diversification is a recognised adaptation option; benefits are strongest when combined with mulching or water harvesting.", "horizon": "Medium (2-5 years)", "confidence": "Medium", "source": "IPCC AR6 WGII (2022) Ch. 5; FAO climate-smart agriculture guidance"}];

const LINKS = [
  [["low_soc","water_limited"], "Low soil organic carbon weakens aggregate stability and water-holding, so scarce rain is lost to runoff and evaporation. Soil carbon and water capture must be raised together.", "Lal (2004), Science 304:1623-1627; FAO (2017)"],
  [["monoculture","fragmentation"], "Monoculture at field scale plus fragmented habitat at landscape scale removes both food and refuge for pollinators and natural enemies, so field margins and corridors matter more than either alone.", "Tscharntke et al. (2005), Ecology Letters 8:857-874"],
  [["acidic","low_soc"], "Acidity suppresses decomposition and legume nodulation, so legume cover crops may underperform until pH is corrected. Sequence liming before cover crops.", "Fierer & Jackson (2006), PNAS 103:626-631"],
  [["heat","water_limited"], "Heat raises evapotranspiration and speeds soil carbon decomposition, compounding drought stress on species survival. Shade and mulch address both.", "IPCC AR6 WGII (2022) Ch. 5"],
  [["pollution","monoculture"], "Monocultures tend to depend on more pesticide, which suppresses the natural enemies that would otherwise reduce that dependence.", "Geiger et al. (2010), Basic Appl. Ecol. 11:97-105"],
  [["deforestation","water_limited"], "Losing tree cover reduces infiltration and local moisture recycling, making dry land drier. Restoring cover feeds back into water availability.", "IPCC SRCCL (2019)"]
];
const REQUIRED = {soc:"soil organic carbon (%)", rainfall:"rainfall pattern (low / medium / high, or mm per year)", land_use:"land-use type or crop (e.g. monoculture wheat, pasture, forest)"};
const OPTIONAL = {ph:"soil pH", region:"climate region (arid, semi-arid, humid, temperate)"};
const CROPS = ["wheat","rice","maize","corn","cotton","soy","sugarcane","millet","sorghum","barley"];
const LAND_WORDS = {pasture:"pasture",grazing:"pasture",forest:"forest",plantation:"plantation",wetland:"wetland",orchard:"orchard",cropland:"cropland",farm:"cropland"};

/* ---------- Knowledge layer: TF-IDF vector index over the KB ---------- */
const STOP = new Set("the a an and or of to in on for with by is are be as at it its this that from into your you".split(" "));
const tok = s => (s.toLowerCase().match(/[a-z_]{2,}/g) || []).filter(w => !STOP.has(w));
const docs = KB.map(k => tok([k.title,k.action,k.why,k.metrics.join(" "),k.triggers.join(" ")].join(" ")));
const N = docs.length, df = {};
docs.forEach(d => new Set(d).forEach(w => df[w] = (df[w]||0) + 1));
const idf = w => Math.log((1+N)/(1+(df[w]||0))) + 1;
function vec(tokens){
  const tf = {}; tokens.forEach(w => tf[w] = (tf[w]||0) + 1);
  const v = {}; let n = 0;
  for (const w in tf){ if(!df[w]) continue; const x = (1+Math.log(tf[w]))*idf(w); v[w]=x; n+=x*x; }
  n = Math.sqrt(n) || 1; for (const w in v) v[w] /= n; return v;
}
const dvecs = docs.map(vec);
const cos = (a,b) => { let s=0; for(const w in a) if(b[w]) s+=a[w]*b[w]; return s; };

/* ---------- Input handling ---------- */
function extract(text){
  const t = text.toLowerCase(), o = {}; let m;
  m = t.match(/(?:organic carbon|soc)\D{0,20}?(\d+(?:\.\d+)?)\s*%/) || t.match(/(\d+(?:\.\d+)?)\s*%\s*(?:soc|organic carbon)/);
  if (m) o.soc = parseFloat(m[1]);
  m = t.match(/\bph\b\D{0,8}(\d+(?:\.\d+)?)/); if (m) o.ph = parseFloat(m[1]);
  m = t.match(/(\d{2,4})\s*mm/);
  if (m) o.rainfall_mm = parseFloat(m[1]);
  else if (/(low|scanty|erratic|poor)\W+(rain|rainfall)|rainfall\W+(is\s+)?(low|poor)|drought|\bdry\b/.test(t)) o.rainfall = "low";
  else if (/(high|heavy)\W+(rain|rainfall)|rainfall\W+(is\s+)?high/.test(t)) o.rainfall = "high";
  else if (/(medium|moderate)\W+(rain|rainfall)|rainfall\W+(is\s+)?(medium|moderate)/.test(t)) o.rainfall = "medium";
  m = t.match(/(\d{2}(?:\.\d+)?)\s*(?:°|deg(?:rees)?)\s*c/); if (m) o.temp_c = parseFloat(m[1]);
  m = t.match(/richness\D{0,15}(\d+)/); if (m) o.species_richness = parseInt(m[1]);
  const crop = CROPS.find(c => t.includes(c)); if (crop) o.crop = crop;
  if (/monoculture|monocrop|single crop/.test(t)) o.land_use = "monoculture";
  else {
    const k = Object.keys(LAND_WORDS).find(w => t.includes(w));
    if (k) o.land_use = LAND_WORDS[k]; else if (crop) o.land_use = "cropland";
  }
  const r = ["semi-arid","semiarid","arid","humid","tropical","temperate","mediterranean","boreal"].find(x => t.includes(x));
  if (r) o.region = r === "semiarid" ? "semi-arid" : r;
  if (/pesticide|fertili[sz]er|pollut|contaminat/.test(t)) o.pollution = true;
  if (/deforest|logging|clear(?:ed|ing)/.test(t)) o.deforestation = true;
  if (/fragment|isolated|patches/.test(t)) o.fragmentation = true;
  if (/declin|decreas|dropp|loss of (?:species|biodiversity)/.test(t)) o.declining = true;
  return o;
}
function normalize(p){
  p = {...p};
  if (p.rainfall_mm != null) p.rainfall = p.rainfall_mm < 500 ? "low" : p.rainfall_mm < 1200 ? "medium" : "high";
  if (p.lat != null && !p.region){
    const a = Math.abs(parseFloat(p.lat));
    p.climate_zone_from_lat = a < 23.5 ? "tropical" : a < 35 ? "subtropical" : a < 55 ? "temperate" : "boreal";
  }
  return p;
}
function merge(profile, add){
  const out = {...profile};
  if (add.rainfall != null && add.rainfall_mm == null) delete out.rainfall_mm;
  for (const k in add) if (add[k] != null) out[k] = add[k];
  return normalize(out);
}
function missing(p){ return Object.entries(REQUIRED).filter(([k]) => p[k] == null).map(([,v]) => v); }
function optionalQs(p){ return Object.entries(OPTIONAL).filter(([k]) => p[k] == null).map(([,v]) => v); }

/* ---------- Multi-variable diagnosis ---------- */
function diagnose(p){
  const d = {};
  if (p.soc != null && p.soc < 1.0) d.low_soc = `Very low soil organic carbon (${p.soc}%): weak structure, low microbial food supply`;
  if (p.ph != null && p.ph < 5.5) d.acidic = `Acidic soil (pH ${p.ph}): suppresses microbial diversity and nutrient availability`;
  if (p.ph != null && p.ph > 8.0) d.alkaline = `Alkaline soil (pH ${p.ph}): reduced micronutrient availability`;
  const zone = p.region || p.climate_zone_from_lat;
  if (p.rainfall === "low" || zone === "arid" || zone === "semi-arid") d.water_limited = "Water-limited conditions (low rainfall or arid climate): species survival depends on moisture retention";
  if (p.temp_c != null && p.temp_c >= 30) d.heat = `High mean temperature (${p.temp_c} C): raises evaporation and carbon loss`;
  if (p.land_use === "monoculture") d.monoculture = "Monoculture land use: low habitat and structural diversity";
  if (p.fragmentation) d.fragmentation = "Habitat fragmentation: isolated patches limit species movement";
  if (p.pollution) d.pollution = "Chemical inputs or pollution pressure";
  if (p.deforestation) d.deforestation = "Deforestation or loss of tree cover";
  if (p.declining) d.declining = "Reported biodiversity decline";
  return d;
}

/* ---------- Retrieval + ranking: 0.4 x trigger matches + TF-IDF similarity ---------- */
function recommend(p, k = 4){
  const issues = diagnose(p), codes = Object.keys(issues);
  const q = codes.join(" ") + " " + Object.values(issues).join(" ") + " " + Object.values(p).map(String).join(" ");
  const qv = vec(tok(q));
  const rows = [];
  KB.forEach((e, i) => {
    const hit = codes.filter(c => e.triggers.includes(c));
    if (hit.length){ const sim = cos(qv, dvecs[i]); rows.push({e, hit, sim, score: 0.4*hit.length + sim}); }
  });
  rows.sort((a,b) => b.score - a.score);
  const links = LINKS.filter(([req]) => req.every(c => codes.includes(c)));
  return {issues, recs: rows.slice(0,k), links};
}

/* ---------- Rendering ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function horizonBar(h){
  const s = h.toLowerCase();
  const idx = ["short","medium","long"].map((w,i) => s.includes(w) ? i : -1).filter(i => i >= 0);
  const lo = Math.min(...idx), hi = Math.max(...idx);
  const segs = [0,1,2].map(i => `<span class="${i>=lo && i<=hi ? "on" : ""}"></span>`).join("");
  return `<div class="hz" role="img" aria-label="Time horizon: ${esc(h)}"><div class="bar" aria-hidden="true">${segs}</div><span>${esc(h)}</span></div>`;
}
function renderResult({issues, recs, links}, p){
  if (!Object.keys(issues).length) return `<p>I could not detect a clear stressor from these inputs. Share soil organic carbon, rainfall and land use so I can look further.</p>`;
  let h = `<h2 class="sec">Diagnosis</h2><ul>${Object.values(issues).map(v => `<li>${esc(v)}</li>`).join("")}</ul>`;
  if (links.length) h += `<h2 class="sec">How the variables interact</h2>` + links.map(([,t,s]) => `<div class="link">${esc(t)} <em>(${esc(s)})</em></div>`).join("");
  h += `<h2 class="sec">Recommendations</h2>`;
  recs.forEach((r, n) => {
    const e = r.e;
    h += `<article class="rec"><h3>${n+1}. ${esc(e.title)}</h3>${horizonBar(e.horizon)}
      <div class="row"><b>What to do</b>${esc(e.action)}</div>
      <div class="row"><b>Why it works</b>${esc(e.why)}</div>
      <div class="row"><b>Metrics improved</b><div class="chips">${e.metrics.map(m => `<span class="tag">${esc(m)}</span>`).join("")}</div></div>
      <div class="row"><b>Expected effect</b>${esc(e.effect)}</div>
      <div class="row"><b>Confidence</b><span class="conf">${esc(e.confidence)}</span></div>
      <div class="row"><b>Addresses</b>${esc(r.hit.join(", "))}</div>
      <div class="row"><b>Source</b><span class="src">${esc(e.source)}</span></div></article>`;
  });
  h += `<details><summary>How this knowledge was retrieved</summary><div class="scroll"><table><thead><tr><th>Entry</th><th>Matched</th><th>Sim.</th><th>Score</th></tr></thead><tbody>${
    recs.map(r => `<tr><td>${esc(r.e.title)}</td><td>${esc(r.hit.join(", "))}</td><td>${r.sim.toFixed(3)}</td><td>${r.score.toFixed(3)}</td></tr>`).join("")
  }</tbody></table></div><p class="hint">Score = 0.4 x matched issues + TF-IDF cosine similarity against ${KB.length} cited knowledge entries.</p></details>`;
  const oq = optionalQs(p);
  if (oq.length) h += `<p class="hint">For sharper advice, add: ${esc(oq.join("; "))}.</p>`;
  return h;
}

/* ---------- Chat ---------- */
let profile = {};
const chat = document.getElementById("chat");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function add(role, html, isText){
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (isText) d.textContent = html; else d.innerHTML = html;
  chat.appendChild(d);
  d.scrollIntoView({block: role === "bot" ? "start" : "end", behavior: reduce ? "auto" : "smooth"});
}
function drawMemory(){
  const m = document.getElementById("memory");
  const items = Object.entries(profile).filter(([k]) => !k.startsWith("climate_zone"));
  if (!items.length){ m.innerHTML = ""; return; }
  m.innerHTML = `<span class="label">Remembered:</span>` +
    items.map(([k,v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join("") +
    `<button class="linkbtn" id="reset" type="button">Reset</button>`;
  document.getElementById("reset").onclick = () => {
    profile = {}; drawMemory(); chat.innerHTML = ""; chat.appendChild(intro);
  };
}
const intro = document.getElementById("intro");
function respond(text, structured){
  const add_ = {...extract(text || ""), ...(structured || {})};
  profile = merge(profile, add_);
  drawMemory();
  const skip = /\bskip\b|just recommend/i.test(text || "");
  const miss = missing(profile);
  if (miss.length && !skip){
    return `<p>To give evidence-based advice I need a bit more information:</p><ul>${miss.map(q => `<li>Could you share your ${esc(q)}?</li>`).join("")}</ul><p class="hint">Say "skip" to continue with what I have.</p>`;
  }
  return renderResult(recommend(profile), profile);
}
function send(text){
  if (!text.trim()) return;
  intro.remove();
  add("user", text, true);
  add("bot", respond(text));
}
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const i = document.getElementById("text"); const v = i.value; i.value = ""; send(v);
});
document.querySelectorAll(".ex").forEach(b => b.addEventListener("click", () => send(b.dataset.q)));
document.getElementById("runjson").addEventListener("click", () => {
  let data;
  try { data = JSON.parse(document.getElementById("json").value); }
  catch (err){ add("bot", `<p>That JSON is not valid: ${esc(err.message)}. Check commas and quotes, then try again.</p>`); return; }
  intro.remove();
  add("user", "JSON input: " + JSON.stringify(data), true);
  add("bot", respond("", data));
});
</script>
